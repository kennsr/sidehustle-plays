<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidehustle Plays — social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
/* Source for og.png — render at 1200x630:
   chrome --headless --screenshot=og.png --window-size=1200,630 og-card.html */
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:1200px;height:630px;overflow:hidden;position:relative;
  background:
    radial-gradient(900px 620px at 22% -20%, #14403a 0%, rgba(20,64,58,0) 62%),
    radial-gradient(760px 560px at 92% 118%, #0c3341 0%, rgba(12,51,65,0) 60%),
    #070c0b;
  color:#f1ebdd;font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  display:flex;align-items:center;gap:56px;padding:0 84px;
}
.copy{flex:1 1 auto;min-width:0}
.eyebrow{
  font-family:"DM Mono",ui-monospace,monospace;font-size:19px;letter-spacing:.3em;
  text-transform:uppercase;color:#2fd3ea;display:flex;align-items:center;gap:14px;
}
.lamp{width:11px;height:11px;border-radius:50%;background:#2fd3ea;box-shadow:0 0 18px #2fd3ea}
h1{
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:104px;
  line-height:.98;letter-spacing:-.025em;margin:26px 0 20px;
}
.sub{font-size:27px;color:#8d9994;font-weight:400}
.sub b{color:#f1ebdd;font-weight:600}

/* a slice of the reel, cut by the payline */
.slice{
  margin-top:44px;width:560px;padding:22px 30px;border-radius:14px;
  background:linear-gradient(180deg,#050908,#0b1211);
  border-top:2px solid rgba(47,211,234,.5);border-bottom:2px solid rgba(47,211,234,.5);
  box-shadow:0 0 40px -10px rgba(47,211,234,.3);
  position:relative;
}
.slice .tag{
  font-family:"DM Mono",ui-monospace,monospace;font-size:14px;letter-spacing:.24em;
  text-transform:uppercase;color:#2fd3ea;
}
.slice .name{font-family:"Playfair Display",Georgia,serif;font-size:42px;margin-top:8px;line-height:1}
.slice::before,.slice::after{
  content:"";position:absolute;top:50%;margin-top:-9px;width:0;height:0;
  border-top:9px solid transparent;border-bottom:9px solid transparent;
}
.slice::before{left:-1px;border-left:13px solid #2fd3ea}
.slice::after{right:-1px;border-right:13px solid #2fd3ea}

.lever{flex:0 0 auto;width:310px;align-self:center;filter:drop-shadow(0 30px 40px rgba(0,0,0,.65))}
.lever svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
  <div class="copy">
    <div class="eyebrow"><i class="lamp"></i>Ready</div>
    <h1>Sidehustle&nbsp;Plays</h1>
    <p class="sub">Eight ways to get paid. <b>Pull the lever. Take the play.</b></p>
    <div class="slice">
      <div class="tag">Writing</div>
      <div class="name">Newsletter Ghostwriting</div>
    </div>
  </div>

  <div class="lever">
    <svg viewBox="0 0 216 336" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#2b3634"/><stop offset=".28" stop-color="#c8d2ce"/>
          <stop offset=".52" stop-color="#8b9793"/><stop offset=".78" stop-color="#e9efec"/>
          <stop offset="1" stop-color="#39433f"/>
        </linearGradient>
        <radialGradient id="ball" cx=".34" cy=".3" r=".78">
          <stop offset="0" stop-color="#ff8d7c"/><stop offset=".42" stop-color="#d93a2b"/>
          <stop offset="1" stop-color="#6d150e"/>
        </radialGradient>
        <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#232e2c"/><stop offset="1" stop-color="#0c1211"/>
        </linearGradient>
      </defs>
      <ellipse cx="60" cy="300" rx="46" ry="15" fill="#040807" opacity=".7"/>
      <rect x="18" y="258" width="84" height="44" rx="16" fill="url(#base)" stroke="rgba(241,235,221,.16)"/>
      <g transform="rotate(30 60 268)">
        <rect x="51" y="72" width="18" height="200" rx="9" fill="url(#chrome)"/>
        <rect x="46" y="98" width="28" height="9" rx="4.5" fill="#9aa5a1"/>
        <circle cx="60" cy="52" r="32" fill="url(#ball)"/>
        <ellipse cx="49" cy="39" rx="10" ry="6.5" fill="#fff" opacity=".28" transform="rotate(-28 49 39)"/>
      </g>
      <circle cx="60" cy="268" r="8" fill="#151f1d" stroke="rgba(241,235,221,.22)"/>
    </svg>
  </div>
</body>
</html>
